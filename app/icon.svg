<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="wv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5e93"/><stop offset="1" stop-color="#13294a"/>
    </linearGradient>

    <path id="wv-ring" d="M-25 -10 A15 15 0 0 1 -10 -25 H10 A15 15 0 0 1 25 -10 V10
                           A15 15 0 0 1 10 25 H-10 A15 15 0 0 1 -25 10 Z"/>
    <!-- 두 교차점을 잇는 대각선(x+y=120)의 아래쪽 반평면 -->
    <clipPath id="wv-half">
      <path d="M120 0 L120 120 L0 120 Z"/>
    </clipPath>
    </defs>
  <rect width="120" height="120" rx="27" fill="url(#wv-bg)"/>
  <g color="#ffffff" transform="translate(60 60) scale(0.82) translate(-60 -60)">

  <g fill="none" stroke="currentColor" stroke-width="11" stroke-linejoin="round">
    <use href="#wv-ring" transform="translate(47 47)"/>
    <use href="#wv-ring" transform="translate(73 73)"/>
    <g clip-path="url(#wv-half)">
      <use href="#wv-ring" transform="translate(47 47)"/>
    </g>
  </g>
</g>
</svg>
